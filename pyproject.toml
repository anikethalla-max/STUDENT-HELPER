[project]
name = "learn-a-topic"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.38",
    "fastapi>=0.115,<1",
    "langchain>=1.2,<2",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1,<2",
    "langchain-openai>=1.1,<2",
    "langgraph>=1.2.22,<2",
    "langgraph-checkpoint-postgres>=3.2.1",
    "langsmith>=0.4,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "pypdf>=7,<8",
    "uvicorn>=0.30,<1",
]

[tool.uv]
# Windows Application Control blocked the xxhash 4.1.0 wheel on this machine.
constraint-dependencies = ["xxhash==3.6.0; sys_platform == 'win32'"]
